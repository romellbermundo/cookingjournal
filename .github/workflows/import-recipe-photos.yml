name: Organize recipe images
on:
  push:
    branches: [main]
    paths:
      - 'recipe-photos*.zip'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.webp'
      - '*.PNG'
      - '*.JPG'
      - '*.JPEG'
      - '*.WEBP'
      - '.github/workflows/import-recipe-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: recipe-photo-import
  cancel-in-progress: false
jobs:
  organize-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import newest downloaded ZIP and organize root images
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import re, shutil, zipfile
          dest = Path('images')
          dest.mkdir(exist_ok=True)
          extensions = {'.png', '.jpg', '.jpeg', '.webp'}
          pattern = re.compile(r'^recipe-photos(?: \((\d+)\))?\.zip$', re.I)
          archives = []
          for p in Path('.').iterdir():
              if not p.is_file():
                  continue
              match = pattern.fullmatch(p.name)
              if match:
                  archives.append((int(match.group(1) or 0), p))
          if archives:
              # Browser download suffixes increment: (2) supersedes (1).
              _, archive = max(archives, key=lambda item: (item[0], item[1].name))
              print(f'Importing newest ZIP: {archive.name}')
              with zipfile.ZipFile(archive) as z:
                  entries = [i for i in z.infolist() if not i.is_dir()]
                  if not 1 <= len(entries) <= 100:
                      raise SystemExit('ZIP must contain 1-100 images.')
                  names = set()
                  for entry in entries:
                      name = PurePosixPath(entry.filename).name
                      if not name or name.startswith('.') or Path(name).suffix.lower() not in extensions:
                          raise SystemExit(f'Invalid image: {entry.filename}')
                      if entry.file_size > 10 * 1024 * 1024 or name in names:
                          raise SystemExit(f'Oversized or duplicate image: {name}')
                      names.add(name)
                  for entry in entries:
                      target = dest / PurePosixPath(entry.filename).name
                      with z.open(entry) as src, target.open('wb') as out:
                          shutil.copyfileobj(src, out)
                      print(f'Installed {target} (replaced existing if present)')
              for _, p in archives:
                  p.unlink()
                  print(f'Removed processed/obsolete upload: {p.name}')
          for path in Path('.').iterdir():
              if path.is_file() and not path.is_symlink() and path.suffix.lower() in extensions:
                  if path.stat().st_size > 10 * 1024 * 1024:
                      raise SystemExit(f'Image too large: {path.name}')
                  shutil.move(str(path), str(dest / path.name))
                  print(f'Moved root image: {path.name}')
          PY
      - name: Commit organized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import latest recipe photo upload"
            git push
          fi
