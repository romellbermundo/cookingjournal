name: Import recipe photos
on:
  push:
    branches: [main]
    paths:
      - 'recipe-photos.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and extract image ZIP
        run: |
          python3 - <<'PY'
          import pathlib, zipfile, shutil
          archive = pathlib.Path('recipe-photos.zip')
          if not archive.exists():
              raise SystemExit('Upload recipe-photos.zip at repository root first.')
          dest = pathlib.Path('images')
          dest.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              entries = [i for i in z.infolist() if not i.is_dir()]
              if not entries or len(entries) > 100:
                  raise SystemExit('ZIP must contain 1–100 images.')
              for entry in entries:
                  name = pathlib.PurePosixPath(entry.filename).name
                  if not name.lower().endswith(('.webp','.png','.jpg','.jpeg')):
                      raise SystemExit(f'Unsupported file: {entry.filename}')
                  if entry.file_size > 10 * 1024 * 1024:
                      raise SystemExit(f'Image too large: {entry.filename}')
                  if not name or name.startswith('.'):
                      raise SystemExit('Invalid filename')
                  with z.open(entry) as src, (dest / name).open('wb') as out:
                      shutil.copyfileobj(src,out)
          archive.unlink()
          PY
      - name: Commit imported images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ recipe-photos.zip
          if ! git diff --cached --quiet; then
            git commit -m "Import recipe photos from ZIP"
            git push
          fi
